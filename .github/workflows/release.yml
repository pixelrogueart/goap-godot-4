name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PLUGIN_CFG: addons/goap/plugin.cfg
  GODOT_VERSION: "4.6"

jobs:
  bump-version:
    runs-on: ubuntu-latest
    environment: godot
    if: "!contains(github.event.head_commit.message, '[skip tag]') && (contains(github.event.head_commit.message, 'fix') || contains(github.event.head_commit.message, 'feat'))"
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      commit_sha: ${{ steps.tag.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.CI_PUSH_TOKEN }}

      - name: Bump version
        id: bump
        run: |
          CURRENT=$(grep "^version=" "$PLUGIN_CFG" | cut -d'"' -f2)
          MAJOR=$(echo "$CURRENT" | cut -d'.' -f1)
          MINOR=$(echo "$CURRENT" | cut -d'.' -f2)
          PATCH=$(echo "$CURRENT" | cut -d'.' -f3)
          PATCH=${PATCH:-0}
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if echo "$COMMIT_MSG" | grep -q "\[major\]"; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif echo "$COMMIT_MSG" | grep -q "\[minor\]"; then
            MINOR=$((MINOR + 1)); PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          sed -i "s/^version=.*/version=\"${NEW_VERSION}\"/" "$PLUGIN_CFG"
          echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT

      - name: Commit, tag and push
        id: tag
        run: |
          git config user.email "ci@noreply.github.com"
          git config user.name "GitHub Actions"
          git add "$PLUGIN_CFG"
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }} [skip ci]"
          # Retry with rebase: another commit may land on main between checkout and push.
          # The tag is only created after the branch push succeeds so it can never
          # point at a commit that is not on main.
          for i in 1 2 3; do
            if git push origin HEAD:main; then break; fi
            if [ "$i" = "3" ]; then echo "Push failed after 3 attempts"; exit 1; fi
            git pull --rebase origin main
          done
          git tag -a "v${{ steps.bump.outputs.new_version }}" -m "Release v${{ steps.bump.outputs.new_version }}"
          git push origin "v${{ steps.bump.outputs.new_version }}"
          echo "commit_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

  publish-asset-library:
    runs-on: ubuntu-latest
    environment: godot
    needs: bump-version
    if: always() && (needs.bump-version.result == 'success' || contains(github.event.head_commit.message, '[skip tag]'))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version and SHA
        id: version
        run: |
          if [ -n "${{ needs.bump-version.outputs.new_version }}" ]; then
            echo "version=${{ needs.bump-version.outputs.new_version }}" >> $GITHUB_OUTPUT
            echo "commit_sha=${{ needs.bump-version.outputs.commit_sha }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(grep "^version=" "$PLUGIN_CFG" | cut -d'"' -f2)
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "commit_sha=$(git rev-list -n 1 v${VERSION})" >> $GITHUB_OUTPUT
          fi

      - name: Publish to Godot Asset Library
        env:
          ASSET_LIB_USERNAME: ${{ secrets.ASSET_LIB_USERNAME }}
          ASSET_LIB_PASSWORD: ${{ secrets.ASSET_LIB_PASSWORD }}
          ASSET_LIB_ID: ${{ secrets.ASSET_LIB_ID }}
          GODOT_VERSION: ${{ env.GODOT_VERSION }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ steps.version.outputs.commit_sha }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          TOKEN=$(curl -sS -X POST "https://godotengine.org/asset-library/api/login" \
              -F "username=${ASSET_LIB_USERNAME}" \
              -F "password=${ASSET_LIB_PASSWORD}" \
              | jq -r '.token')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Asset Library login failed - check ASSET_LIB_USERNAME and ASSET_LIB_PASSWORD secrets"
            exit 1
          fi

          EDIT_RESPONSE=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" -X POST "https://godotengine.org/asset-library/api/asset/${ASSET_LIB_ID}" \
              -F "token=${TOKEN}" \
              -F "version_string=${VERSION}" \
              -F "godot_version=${GODOT_VERSION}" \
              -F "download_provider=GitHub" \
              -F "download_commit=${COMMIT_SHA}" \
              -F "browse_url=https://github.com/${REPO}")

          HTTP_STATUS=$(echo "${EDIT_RESPONSE}" | grep "HTTP_STATUS:" | cut -d: -f2)
          BODY=$(echo "${EDIT_RESPONSE}" | grep -v "HTTP_STATUS:")
          echo "HTTP status: ${HTTP_STATUS}"
          echo "Response: ${BODY}"

          echo "${BODY}" | jq -e '.id' > /dev/null || { echo "Publish failed"; exit 1; }
          echo "Published v${VERSION} to Godot Asset Library"
